<div class="flex justify-center mt-8">
  <div class="w-full max-w-4xl">
    <form class="flex flex-col md:flex-row gap-3">
      <div class="w-full md:w-auto">
        <select
          #inputTypeTransaction
          (change)="save_type_transaction(inputTypeTransaction.value)"
          class="w-full bg-green-600 text-white p-2 rounded border-none focus:ring-2 focus:ring-green-400 outline-none">
          <option value="ingresoOperacion" selected>+</option>
          <option value="egresoOperacion">-</option>
        </select>
      </div>
      <div class="flex-grow">
        <input
          #inputDescription
          (input)="save_description_transaction(inputDescription.value)"
          type="text"
          class="w-full border bg-white border-green-500 p-2 rounded focus:ring-2 focus:ring-green-400 outline-none"
          placeholder="Descripción" required/>
      </div>
      <div class="w-full md:w-32">
        <input
          #inputAmount
          (input)="save_amount_transaction(+inputAmount.value)"
          type="number"
          class="w-full border bg-white border-green-500 p-2 rounded focus:ring-2 focus:ring-green-400 outline-none"
          placeholder="Valor" required/>
      </div>
      <div class="w-full md:w-auto">
        <button
          (click)="add_transaction()"
          type="button"
          class="w-full bg-green-600 hover:bg-green-700 text-white p-2 rounded transition-colors flex justify-center items-center">
          Agregar
        </button>
      </div>
    </form>
  </div>
</div>
